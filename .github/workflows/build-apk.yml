name: build-telegram-fork

on:
  workflow_dispatch:
    inputs:
      promote_run:
        description: 'Номер прогона, чей артефакт опубликовать (пусто — обычная сборка)'
        required: false
        type: string
  push:
    branches:
      - main

jobs:
  build:
    # Нужен x86-64: Android SDK и NDK не собираются под ARM.
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout upstream with submodules
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          # Закреплённый коммит: патч ниже собран под него и не должен
          # отвалиться, когда upstream уедет вперёд.
          ref: dc780e81ed1261c369c27870e8e0999a1eb0b600
          submodules: recursive
          fetch-depth: 1
          path: telegram

      - name: Checkout own repo
        # Патч берём из того же коммита, который собираем. Раньше он был
        # вшит в этот YAML как base64, из-за чего разошёлся с fork.patch
        # и сборки уходили с кодом, которого в патче не было.
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Apply fork patch
        working-directory: telegram
        run: |
          cp ../fork/fork.patch fork.patch
          git apply --whitespace=nowarn fork.patch

          # Плагины обязаны лежать в res/raw уже в дереве, до сборки.
          for f in peek_online streams word_filters; do
            RAWF="TMessagesProj/src/main/res/raw/$f.js"
            if [ ! -s "$RAWF" ]; then
              echo "::error::после наложения патча нет $RAWF"
              exit 1
            fi
            grep -q '"id":"'"$f"'"' "$RAWF" || { echo "::error::в $RAWF нет манифеста"; exit 1; }
          done
          grep -q 'R.raw.peek_online' TMessagesProj/src/main/java/org/telegram/messenger/ForkPluginManager.java || {
            echo "::error::seedBundled() не читает res/raw — плагины не появятся"; exit 1; }
          echo "  встроенные плагины в исходниках на месте"
          echo "--- проверка правок ---"
          grep -n 'abiFilters' TMessagesProj_App/build.gradle
          grep -n 'buildConfig' TMessagesProj/build.gradle
          grep -c 'ForkDiagnostics' TMessagesProj/src/main/java/org/telegram/messenger/ForkDiagnostics.java

      - name: Sanity check fork resources
        # Экранирование в strings.xml Android проверяет только на этапе
        # flatten, через ~7 минут после старта сборки. Ловим тут, за секунды.
        working-directory: telegram
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys
          res = pathlib.Path("TMessagesProj/src/main/res")
          bad = []
          for p in sorted(res.glob("values*/strings.xml")):
              for line in p.read_text(encoding="utf-8").splitlines():
                  m = re.search(r'<string name="(Fork\w+)"[^>]*>(.*)</string>', line)
                  if not m:
                      continue
                  for i, ch in enumerate(m.group(2)):
                      if ch in "'\"" and (i == 0 or m.group(2)[i-1] != "\\"):
                          bad.append((p.parent.name, m.group(1), m.group(2)))
                          break
          for loc, name, text in bad:
              print("::error file=%s::%s: неэкранированная кавычка: %s" % (loc, name, text))
          if bad:
              sys.exit(1)
          print("строки в порядке")
          PYEOF

      - name: Sanity check CI scripts
        # Информационный шаг: он не имеет права валить сборку. Ловит опечатки
        # в bash-скриптах (из-за одной прогон остановился после 47 минут),
        # но любые свои ошибки только показывает.
        run: |
          python3 - <<'PYEOF'
          import subprocess, traceback
          try:
              import yaml
              doc = yaml.safe_load(open(".github/workflows/build-apk.yml"))
              checked = bad = 0
              for job in (doc.get("jobs") or {}).values():
                  for step in job.get("steps", []) or []:
                      script = step.get("run")
                      if not script or "PYEOF" in script or "yaml" in script:
                          continue
                      checked += 1
                      proc = subprocess.run(["bash", "-n"], input=script, text=True,
                                            capture_output=True)
                      if proc.returncode:
                          bad += 1
                          print("::error::синтаксис в шаге %r: %s"
                                % (step.get("name"), proc.stderr.strip()))
              print("проверено shell-блоков: %d, ошибок: %d" % (checked, bad))
          except Exception:
              print("::warning::само��ровка не выполнена")
              print(traceback.format_exc())
          PYEOF

      - name: Write gradle.properties overrides
        # Задаётся отдельным шагом, а не патчем: так не ломается,
        # когда upstream меняет свой gradle.properties.
        working-directory: telegram
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF

          # Форк ставится рядом с официальным Telegram, а не поверх него.
          APP_PACKAGE=org.telegram.messenger.fork
          APP_VERSION_NAME=12.10.5-fork

          # Личный ключ форка из секретов, не из репозитория Telegram.
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=fork
          RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD

          # Штатный -Xmx10248m из шаблона не влезает в раннер.
          org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true

          # Ресурс-шейкер R8 (AGP 8.13+ включает его по умолчанию) выкидывает
          # строки форка: код остаётся в dex, а Resources.NotFoundException
          # падает уже на устройстве. Шейкер AGP tools:keep понимает, и
          # предсказуем — APK чуть больше, но строки на месте.
          android.r8.optimizedResourceShrinking=false
          EOF

      - name: Checkout own repo for google-services.json
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Install signing key
        # Сам файл keystore лежит в этом репозитории: он и так зашифрован
        # паролем, а пароль — в секрете FORK_KEYSTORE_PASSWORD. Поэтому
        # копировать вручную 6 КБ base64 не нужно.
        # Контрольная сумма зафиксирована, чтобы подмена файла валила сборку.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEYSTORE_SHA256: d402eca9685e05197fbe9da238da395dff87be9392c07994aa73403fe56740de
        run: |
          SRC=fork/fork-release.keystore
          echo "$KEYSTORE_SHA256  $SRC" | sha256sum -c - || {
            echo "keystore не совпадает с ожидаемым — сборка остановлена"; exit 1; }
          cp "$SRC" telegram/TMessagesProj/config/release.keystore
          chmod 600 telegram/TMessagesProj/config/release.keystore
          keytool -list -keystore telegram/TMessagesProj/config/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -q "fork" || {
            echo "ключ не открывается, проверь FORK_KEYSTORE_PASSWORD"; exit 1; }
          keytool -list -v -keystore telegram/TMessagesProj/config/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep "SHA1:"
          echo "ключ подписи установлен"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            telegram/.gradle
          key: gradle-${{ runner.os }}-1
          restore-keys: gradle-${{ runner.os }}-

      - name: Register fork package in google-services.json
        # FCM отдаёт токен только если пакет и отпечаток подписи
        # зарегистрированы в Firebase-проекте. Рабочий файл кладётся
        # в корень этого репозитория и подхватывается автоматически.
        # Фолбэк дописывает клиента в проект tmessages2 — сборка пройдёт,
        # но push-уведомления работать не будут.
        working-directory: telegram
        run: |
          if [ -f ../fork/google-services.json ]; then
            cp ../fork/google-services.json TMessagesProj_App/google-services.json
            echo "используем google-services.json из репозитория сборки"
          else
            echo "ВНИМАНИЕ: своего google-services.json нет, FCM работать не будет"
            jq '.client += [(.client[0]
              | .client_info.mobilesdk_app_id = "1:760348033671:android:f0f00f00f00f00f0"
              | .client_info.android_client_info.package_name = "org.telegram.messenger.fork")]' \
              TMessagesProj_App/google-services.json > gs.json
            mv gs.json TMessagesProj_App/google-services.json
          fi
          echo "клиентов: $(jq '.client | length' TMessagesProj_App/google-services.json)"
          jq -r '.client[].client_info.android_client_info.package_name' TMessagesProj_App/google-services.json
          echo "project_id: $(jq -r '.project_info.project_id' TMessagesProj_App/google-services.json)"
          echo "api_key: $(jq -r '[.client[].api_key[]?.current_key] | length' TMessagesProj_App/google-services.json) шт."

      - name: Apply own API credentials
        # Пока секреты не заведены, остаются официальные ключи Telegram.
        # Свои ключи снимают нарушение условий, но уводят форк в
        # «сторонний клиент»: лимиты ниже, passkeys не работают.
        env:
          APP_ID: ${{ secrets.FORK_APP_ID }}
          APP_HASH: ${{ secrets.FORK_APP_HASH }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_HASH" ]; then
            sed -i "s/^    public static int APP_ID = .*/    public static int APP_ID = $APP_ID;/" \
              telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            sed -i "s|^    public static String APP_HASH = .*|    public static String APP_HASH = \"$APP_HASH\";|" \
              telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            echo "используем свои API-ключи"
          else
            echo "ВНИМАНИЕ: FORK_APP_ID/FORK_APP_HASH не заданы, работаем на официальных ключах"
          fi
          grep -nE "APP_ID|APP_HASH" telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java | head -2

      - name: Free runner disk
        # НЕ удаляем /usr/local/lib/android: там живут cmdline-tools,
        # без них sdkmanager не находится и сборка падает с exit 127.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/share/chromium /usr/local/share/swift \
                      /opt/hostedtoolcache/CodeQL
          # Предустановленные пакеты SDK не нужны — ставим ровно свои.
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/cmake \
                      /usr/local/lib/android/sdk/build-tools \
                      /usr/local/lib/android/sdk/platforms
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          command -v sdkmanager >/dev/null || {
            echo "sdkmanager не найден, ищем:"; find /usr/local/lib/android -name sdkmanager -type f; exit 1; }
          yes | sdkmanager --licenses > /dev/null
          # NDK и CMake не нужны для проверки Java, ставим их позже.
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" \
                     "build-tools;36.0.0" "build-tools;35.0.0"
          df -h /

      - name: Fast compile check (Java only, без NDK)
        # Полная сборка занимает ~45 минут, и почти всё это время уходит на
        # нативные модули. Ошибки в нашем Java-коде при этом видно только
        # в самом конце. Этот шаг компилирует только Java и падает за
        # несколько минут, с теми же сообщениями javac, что и сборка.
        working-directory: telegram
        run: |
          set -o pipefail
          # Имя задачи зависит от вкусов модуля, поэтому узнаём его у Gradle.
          TASK=""
          for candidate in :TMessagesProj_App:compileAfatReleaseJavaWithJavac \
                            :TMessagesProj:compileAfatReleaseJavaWithJavac \
                            :TMessagesProj_App:compileReleaseJavaWithJavac \
                            :TMessagesProj:compileReleaseJavaWithJavac; do
            if ./gradlew -q help --task "$candidate" >/dev/null 2>&1; then
              TASK="$candidate"
              break
            fi
          done
          if [ -z "$TASK" ]; then
            echo "::warning::задача компиляции Java не найдена — проверка пропущена"
            ./gradlew -q :TMessagesProj:tasks --all 2>/dev/null | grep -oE "compile[A-Za-z0-9]*JavaWithJavac" | sort -u | head -20
            exit 0
          fi
          echo "Быстрая проверка: $TASK"
          START=$SECONDS
          LOG=$(mktemp)
          if ./gradlew --no-daemon "$TASK" --console=plain > "$LOG" 2>&1; then
            echo "Java собралась за $((SECONDS - START)) c"
          else
            echo "::error title=Ошибка компиляции Java::полная сборка не запускается, смотри ошибки ниже"
            grep -E "^/.*error:|^[0-9]+ errors?$|error: " "$LOG" | head -40 | sed 's/^/::error::/'
            tail -30 "$LOG"
            exit 1
          fi

      - name: Install NDK
        # Ставим после быстрой проверки: пакеты крупные и для Java не нужны.
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
          df -h /

      - name: Build
        working-directory: telegram
        run: |
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK
        run: |
          APK=$(find telegram -name "*.apk" -path "*afat*" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump packagename "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Verify Rhino and fork classes survived R8
        # Без keep-правил R8 переписывает статическую инициализацию Rhino,
        # и приложение падает с ExceptionInInitializerError при открытии
        # любого экрана настроек. Проверяем mapping, а не поведение на
        # устройстве: класс обязан остаться с исходным именем.
        working-directory: telegram
        run: |
          # Путь включает вкус сборки (afatRelease), поэтому ищем файл.
          MAPPING=$(find . -name mapping.txt -path "*outputs/mapping*" | head -1)
          if [ -z "$MAPPING" ]; then
            echo "::error::mapping.txt не найден — minify не отработал?"; exit 1
          fi
          echo "mapping: $MAPPING"
          for cls in org.mozilla.javascript.Context org.mozilla.javascript.ContextFactory \
                     org.telegram.messenger.ForkPluginApi org.telegram.messenger.ForkPlugin \
                     org.telegram.messenger.ForkPluginManager org.telegram.messenger.ForkDiagnostics \
                     org.telegram.ui.ForkPluginInstallActivity \
                     org.telegram.messenger.ForkGhost org.telegram.ui.ForkGhostActivity \
                     org.telegram.messenger.ForkTuning org.telegram.ui.ForkMainSettingsActivity \
                     org.telegram.ui.ForkAnimationActivity; do
            # В mapping у сохранённого класса строка заканчивается двоеточием.
            if ! grep -q "^$cls -> $cls:" "$MAPPING"; then
              echo "::error::$cls обфусцирован или вырезан R8 — нужны keep-правила"
              grep -m1 "^$cls -> " "$MAPPING" || echo "  класса нет в mapping вообще"
              exit 1
            fi
          done
          echo "Rhino и классы форка сохранены R8"

      - name: Verify plugin strings survived the build
        # Проверять имена ресурсов бесполезно: в релизе имена обфусцированы
        # (R8 обфусцирует и имена, и пути), поэтому ищем значения, которые
        # шейкер удалить не может. Диагностика идёт через ::error::, её видно
        # в Annotations на странице рана без авторизации.
        run: |
          APK=$(find telegram -name "*.apk" -path "*afat*release*" | head -1)
          test -n "$APK" || { echo "::error::APK не найден"; exit 1; }
          unzip -p "$APK" resources.arsc > /tmp/arsc.bin
          SIZE=$(wc -c < /tmp/arsc.bin)
          echo "resources.arsc: $SIZE байт"

          fail=0
          need_value() {
            if grep -qa -- "$1" /tmp/arsc.bin; then
              echo "ok: $1"
            else
              echo "::error title=Нет строки в resources.arsc::$(printf '%q' "$1")"
              fail=1
            fi
          }

          # Контроль: штатные строки Telegram, на которые ссылается код.
          # Если их нет, сборка сломана независимо от наших строк.
          need_value "Round Video"
          need_value "Send"

          # Строки форка: плагины и Wi-Fi-автоплей.
          need_value "Huntergram"
          need_value "Load plugin from file"
          need_value "This plugin did not add any settings."
          need_value "Delete this plugin? Its settings will be removed."
          need_value "A plugin is a JavaScript file. It runs in a sandbox and can only add its own settings here. Load plugins from sources you trust."
          need_value "Autoplay videos only on Wi-Fi"
          need_value "No plugins installed yet. Tap \"Load plugin from file\" and pick a .js or .plugin file."
          need_value "Плагинов пока нет. Нажми «Загрузить плагин из файла» и выбери файл .js или .plugin."
          need_value "Last crash"
          need_value "Enable plugin system"
          need_value "Включить систему плагинов"
          need_value "Не удалось установить плагин"
          need_value "Настройки Huntergram"
          need_value "Режим призрака"
          need_value "Не отправлять «онлайн»"
          need_value "Автоматический «оффлайн»"
          need_value "Huntergram settings"
          need_value "Категории"
          need_value "Основные"
          need_value "Не округлять числа"
          need_value "Показывать секунды"
          need_value "Вибрация в приложении"
          need_value "Скорость анимаций"
          need_value "Выключены"
          need_value "The plugin system is turned off. Installed plugins stay in place and start working again after you turn it on."
          need_value "Crash report"
          need_value "Последнее падение"
          need_value "Отчёт о падении"

          if [ "$fail" != 0 ]; then
            echo "::error title=Строки потеряны::Часть строк отсутствует в resources.arsc ($SIZE байт), APK не публикуем"
            exit 1
          fi
          echo "::notice title=Ресурсы в порядке::Все строки форка и контрольные строки на месте ($SIZE байт)"

          # Плагины едут в res/raw. R8 сырые ресурсы не вырезает, в отличие
          # от строковых литералов, — и содержимое видно прямо в APK.
          # AAPT2 сокращает пути ресурсов в release: res/raw/peek_online.js
          # приезжает как res/3Tw.js. Поэтому смотрим содержимое всех res/*,
          # а не каталог с исходным именем.
          RAW=$(unzip -l "$APK" | awk '{print $4}' | grep -c '\.js$')
          echo "  .js записей в APK: $RAW"
          FAILED=0
          for want in '"id":"peek_online"' '"id":"streams"' '"id":"word_filters"' '@fork-plugin'; do
            if unzip -p "$APK" 'res/*' 2>/dev/null | grep -qa -- "$want"; then
              echo "  нашлось в res/raw: $want"
            else
              echo "::error::в APK нет «$want»: встроенные плагины не попали в сборку"
              FAILED=1
            fi
          done
          test "$RAW" -ge 3 || { echo "::error::ожидалось не меньше 3 файлов .js, найдено $RAW"; FAILED=1; }
          test "$FAILED" = 0 || exit 1
      - name: Publish APK from a finished run
        # Сборка с этого сервера не проходит: входящие соединения работают,
        # а выгрузка 42 МБ обрывается. Артефакт уже лежит в прогонах, значит
        # публиковать его надо на стороне CI.
        if: ${{ inputs.promote_run != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ inputs.promote_run }}
        run: |
          AID=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '.artifacts[0].id')
          test -n "$AID" || { echo "::error::у прогона $RUN нет артефактов"; exit 1; }
          gh api "repos/$REPO/actions/artifacts/$AID/zip" > /tmp/art.zip
          rm -rf /tmp/art && mkdir -p /tmp/art && unzip -o -q /tmp/art.zip -d /tmp/art
          APK=$(find /tmp/art -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::в артефакте нет APK"; exit 1; }
          echo "  APK: $APK ($(stat -c%s "$APK") байт), sha256 $(sha256sum "$APK" | cut -c1-16)"
          for want in '"id":"peek_online"' '"id":"streams"' '"id":"word_filters"'; do
            unzip -p "$APK" 'res/*' 2>/dev/null | grep -qa -- "$want" || {
              echo "::error::в APK нет «$want» — публиковать нечего"; exit 1; }
          done
          echo "  все три плагина внутри"
          cp "$APK" /tmp/telegram-fork-arm64.apk
          gh release upload v12.10.5-fork /tmp/telegram-fork-arm64.apk --clobber -R "$REPO" \
            --notes "Huntergram arm64, сборка прогона $RUN"
          echo "--- ссылка ---"
          gh release view v12.10.5-fork -R "$REPO" --json url -q .url

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          APK=$(find telegram -name "*.apk" -path "*afat*release*" | head -1)
          test -n "$APK" || { echo "APK не найден"; exit 1; }
          cp "$APK" telegram-fork-arm64.apk
          TAG="v12.10.5-fork"
          # -R обязателен: в корне воркспейса нет .git, так как
          # оба checkout лежат в подпапках telegram/ и fork/.
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --title "Telegram fork 12.10.5 (arm64)" \
              --notes "applicationId org.telegram.messenger.fork, ставится рядом с официальным. ABI arm64-v8a."
          gh release upload "$TAG" telegram-fork-arm64.apk --clobber -R "$REPO"
          echo "--- ссылка ---"
          gh release view "$TAG" -R "$REPO" --json url -q .url

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-fork-apk
          path: |
            telegram/TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
