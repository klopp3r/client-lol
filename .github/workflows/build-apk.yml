name: build-telegram-fork

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # Нужен x86-64: Android SDK и NDK не собираются под ARM.
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout upstream with submodules
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          # Закреплённый коммит: патч ниже собран под него и не должен
          # отвалиться, когда upstream уедет вперёд.
          ref: dc780e81ed1261c369c27870e8e0999a1eb0b600
          submodules: recursive
          fetch-depth: 1
          path: telegram

      - name: Apply fork patch
        # Патч в base64: heredoc внутри YAML ломает hunk-заголовки,
        # а checkout тянет только upstream, так что ../fork.patch не существует.
        working-directory: telegram
        run: |
          echo '' | base64 -d > fork.patch
          git apply --whitespace=nowarn fork.patch
          echo "--- проверка правок ---"
          grep -n 'abiFilters' TMessagesProj_App/build.gradle
          grep -n 'buildConfig' TMessagesProj/build.gradle
          grep -c 'ForkDiagnostics' TMessagesProj/src/main/java/org/telegram/messenger/ForkDiagnostics.java

      - name: Write gradle.properties overrides
        # Задаётся отдельным шагом, а не патчем: так не ломается,
        # когда upstream меняет свой gradle.properties.
        working-directory: telegram
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF

          # Форк ставится рядом с официальным Telegram, а не поверх него.
          APP_PACKAGE=org.telegram.messenger.fork
          APP_VERSION_NAME=12.10.5-fork

          # Личный ключ форка из секретов, не из репозитория Telegram.
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=fork
          RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD

          # Штатный -Xmx10248m из шаблона не влезает в раннер.
          org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true

          # Ресурс-шейкер R8 (AGP 8.13+ включает его по умолчанию) выкидывает
          # строки форка: код остаётся в dex, а Resources.NotFoundException
          # падает уже на устройстве. Шейкер AGP tools:keep понимает, и
          # предсказуем — APK чуть больше, но строки на месте.
          android.r8.optimizedResourceShrinking=false
          EOF

      - name: Checkout own repo for google-services.json
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Install signing key
        # Сам файл keystore лежит в этом репозитории: он и так зашифрован
        # паролем, а пароль — в секрете FORK_KEYSTORE_PASSWORD. Поэтому
        # копировать вручную 6 КБ base64 не нужно.
        # Контрольная сумма зафиксирована, чтобы подмена файла валила сборку.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEYSTORE_SHA256: d402eca9685e05197fbe9da238da395dff87be9392c07994aa73403fe56740de
        run: |
          SRC=fork/fork-release.keystore
          echo "$KEYSTORE_SHA256  $SRC" | sha256sum -c - || {
            echo "keystore не совпадает с ожидаемым — сборка остановлена"; exit 1; }
          cp "$SRC" telegram/TMessagesProj/config/release.keystore
          chmod 600 telegram/TMessagesProj/config/release.keystore
          keytool -list -keystore telegram/TMessagesProj/config/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -q "fork" || {
            echo "ключ не открывается, проверь FORK_KEYSTORE_PASSWORD"; exit 1; }
          keytool -list -v -keystore telegram/TMessagesProj/config/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep "SHA1:"
          echo "ключ подписи установлен"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            telegram/.gradle
          key: gradle-${{ runner.os }}-1
          restore-keys: gradle-${{ runner.os }}-

      - name: Register fork package in google-services.json
        # FCM отдаёт токен только если пакет и отпечаток подписи
        # зарегистрированы в Firebase-проекте. Рабочий файл кладётся
        # в корень этого репозитория и подхватывается автоматически.
        # Фолбэк дописывает клиента в проект tmessages2 — сборка пройдёт,
        # но push-уведомления работать не будут.
        working-directory: telegram
        run: |
          if [ -f ../fork/google-services.json ]; then
            cp ../fork/google-services.json TMessagesProj_App/google-services.json
            echo "используем google-services.json из репозитория сборки"
          else
            echo "ВНИМАНИЕ: своего google-services.json нет, FCM работать не будет"
            jq '.client += [(.client[0]
              | .client_info.mobilesdk_app_id = "1:760348033671:android:f0f00f00f00f00f0"
              | .client_info.android_client_info.package_name = "org.telegram.messenger.fork")]' \
              TMessagesProj_App/google-services.json > gs.json
            mv gs.json TMessagesProj_App/google-services.json
          fi
          echo "клиентов: $(jq '.client | length' TMessagesProj_App/google-services.json)"
          jq -r '.client[].client_info.android_client_info.package_name' TMessagesProj_App/google-services.json
          echo "project_id: $(jq -r '.project_info.project_id' TMessagesProj_App/google-services.json)"
          echo "api_key: $(jq -r '[.client[].api_key[]?.current_key] | length' TMessagesProj_App/google-services.json) шт."

      - name: Apply own API credentials
        # Пока секреты не заведены, остаются официальные ключи Telegram.
        # Свои ключи снимают нарушение условий, но уводят форк в
        # «сторонний клиент»: лимиты ниже, passkeys не работают.
        env:
          APP_ID: ${{ secrets.FORK_APP_ID }}
          APP_HASH: ${{ secrets.FORK_APP_HASH }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_HASH" ]; then
            sed -i "s/^    public static int APP_ID = .*/    public static int APP_ID = $APP_ID;/" \
              telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            sed -i "s|^    public static String APP_HASH = .*|    public static String APP_HASH = \"$APP_HASH\";|" \
              telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            echo "используем свои API-ключи"
          else
            echo "ВНИМАНИЕ: FORK_APP_ID/FORK_APP_HASH не заданы, работаем на официальных ключах"
          fi
          grep -nE "APP_ID|APP_HASH" telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java | head -2

      - name: Free runner disk
        # НЕ удаляем /usr/local/lib/android: там живут cmdline-tools,
        # без них sdkmanager не находится и сборка падает с exit 127.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/share/chromium /usr/local/share/swift \
                      /opt/hostedtoolcache/CodeQL
          # Предустановленные пакеты SDK не нужны — ставим ровно свои.
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/cmake \
                      /usr/local/lib/android/sdk/build-tools \
                      /usr/local/lib/android/sdk/platforms
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          command -v sdkmanager >/dev/null || {
            echo "sdkmanager не найден, ищем:"; find /usr/local/lib/android -name sdkmanager -type f; exit 1; }
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" \
                     "build-tools;36.0.0" "build-tools;35.0.0" \
                     "ndk;27.2.12479018" "cmake;3.22.1"
          df -h /

      - name: Build
        working-directory: telegram
        run: |
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK
        run: |
          APK=$(find telegram -name "*.apk" -path "*afat*" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump packagename "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Verify plugin strings survived the build
        # Проверять имена ресурсов бесполезно: в релизе имена обфусцированы
        # (R8 обфусцирует и имена, и пути), поэтому ищем значения, которые
        # шейкер удалить не может. Диагностика идёт через ::error::, её видно
        # в Annotations на странице рана без авторизации.
        run: |
          APK=$(find telegram -name "*.apk" -path "*afat*release*" | head -1)
          test -n "$APK" || { echo "::error::APK не найден"; exit 1; }
          unzip -p "$APK" resources.arsc > /tmp/arsc.bin
          SIZE=$(wc -c < /tmp/arsc.bin)
          echo "resources.arsc: $SIZE байт"

          fail=0
          need_value() {
            if grep -qa -- "$1" /tmp/arsc.bin; then
              echo "ok: $1"
            else
              echo "::error title=Нет строки в resources.arsc::$(printf '%q' "$1")"
              fail=1
            fi
          }

          # Контроль: штатные строки Telegram, на которые ссылается код.
          # Если их нет, сборка сломана независимо от наших строк.
          need_value "Round Video"
          need_value "Send"

          # Строки форка: плагины и Wi-Fi-автоплей.
          need_value "Telegram Fork"
          need_value "Load plugin from file"
          need_value "This plugin did not add any settings."
          need_value "Delete this plugin? Its settings will be removed."
          need_value "A plugin is a JavaScript file. It runs in a sandbox and can only add its own settings here. Load plugins from sources you trust."
          need_value "Autoplay videos only on Wi-Fi"
          need_value "No plugins installed yet. Tap \"Load plugin from file\" and pick a .js or .plugin file."
          need_value "Плагинов пока нет. Нажми «Загрузить плагин из файла» и выбери файл .js или .plugin."
          need_value "Last crash"
          need_value "Crash report"
          need_value "Последнее падение"
          need_value "Отчёт о падении"

          if [ "$fail" != 0 ]; then
            echo "::error title=Строки потеряны::Часть строк отсутствует в resources.arsc ($SIZE байт), APK не публикуем"
            exit 1
          fi
          echo "::notice title=Ресурсы в порядке::Все строки форка и контрольные строки на месте ($SIZE байт)"

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          APK=$(find telegram -name "*.apk" -path "*afat*release*" | head -1)
          test -n "$APK" || { echo "APK не найден"; exit 1; }
          cp "$APK" telegram-fork-arm64.apk
          TAG="v12.10.5-fork"
          # -R обязателен: в корне воркспейса нет .git, так как
          # оба checkout лежат в подпапках telegram/ и fork/.
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --title "Telegram fork 12.10.5 (arm64)" \
              --notes "applicationId org.telegram.messenger.fork, ставится рядом с официальным. ABI arm64-v8a."
          gh release upload "$TAG" telegram-fork-arm64.apk --clobber -R "$REPO"
          echo "--- ссылка ---"
          gh release view "$TAG" -R "$REPO" --json url -q .url

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-fork-apk
          path: |
            telegram/TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
