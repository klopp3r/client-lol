name: build-telegram-fork

on:
  workflow_dispatch:

jobs:
  build:
    # Нужен x86-64: Android SDK и NDK не собираются под ARM.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream with submodules
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          # Закреплённый коммит: патч ниже собран под него и не должен
          # отвалиться, когда upstream уедет вперёд.
          ref: dc780e81ed1261c369c27870e8e0999a1eb0b600
          submodules: recursive
          fetch-depth: 1
          path: telegram

      - name: Apply fork patch
        # Патч в base64: heredoc внутри YAML ломает hunk-заголовки,
        # а checkout тянет только upstream, так что ../fork.patch не существует.
        working-directory: telegram
        run: |
          echo '' | base64 -d > fork.patch
          git apply --whitespace=nowarn fork.patch
          echo "--- проверка правок ---"
          grep -n 'abiFilters' TMessagesProj_App/build.gradle
          grep -n 'buildConfig' TMessagesProj/build.gradle

      - name: Write gradle.properties overrides
        # Задаётся отдельным шагом, а не патчем: так не ломается,
        # когда upstream меняет свой gradle.properties.
        working-directory: telegram
        run: |
          cat >> gradle.properties <<'EOF'

          # Форк ставится рядом с официальным Telegram, а не поверх него.
          APP_PACKAGE=org.telegram.messenger.fork
          APP_VERSION_NAME=12.10.5-fork

          # Ключ из репозитория Telegram: storePassword/keyPassword=android, alias=androidkey
          RELEASE_STORE_PASSWORD=android
          RELEASE_KEY_ALIAS=androidkey
          RELEASE_KEY_PASSWORD=android

          # Штатный -Xmx10248m из шаблона не влезает в раннер.
          org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          EOF

      - name: Free runner disk
        # НЕ удаляем /usr/local/lib/android: там живут cmdline-tools,
        # без них sdkmanager не находится и сборка падает с exit 127.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/share/chromium /usr/local/share/swift \
                      /opt/hostedtoolcache/CodeQL
          # Предустановленные пакеты SDK не нужны — ставим ровно свои.
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/cmake \
                      /usr/local/lib/android/sdk/build-tools \
                      /usr/local/lib/android/sdk/platforms
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          command -v sdkmanager >/dev/null || {
            echo "sdkmanager не найден, ищем:"; find /usr/local/lib/android -name sdkmanager -type f; exit 1; }
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" \
                     "build-tools;36.0.0" "build-tools;35.0.0" \
                     "ndk;27.2.12479018" "cmake;3.22.1"
          df -h /

      - name: Build
        working-directory: telegram
        run: |
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK
        run: |
          APK=$(find telegram -name "*.apk" -path "*afat*" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump packagename "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-fork-apk
          path: |
            telegram/TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
